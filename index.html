<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AlphaJournal PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
   <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAdux8Hz9o3l7fjdRd1w8rMmgajA6Hp2fU",
            authDomain: "trading-3455b.firebaseapp.com",
            projectId: "trading-3455b",
            storageBucket: "trading-3455b.firebasestorage.app",
            messagingSenderId: "832036590851",
            appId: "1:832036590851:web:bde260c7a0800f424cc536",
            measurementId: "G-QGE3RPH4L7"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
    </script>
</head>
<body class="bg-[#0d1117] text-white min-h-screen">

    <!-- Auth Protected UI Wrapper -->
    <div id="appContainer" class="hidden">
        <header class="p-6 flex justify-between items-center border-b border-gray-800">
            <h1 class="text-xl font-bold">Alpha<span class="text-emerald-400">Journal</span></h1>
            <div class="flex items-center gap-4">
                <span id="userEmail" class="text-sm text-gray-400"></span>
                <button onclick="auth.signOut()" class="text-rose-400 text-sm">Logout</button>
            </div>
        </header>

        <main class="max-w-6xl mx-auto p-6 space-y-6">
            <!-- Weekly Analysis Section -->
            <section class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-gray-900 p-4 rounded-lg border border-gray-800">
                    <p class="text-xs text-gray-500 uppercase">This Week P&L</p>
                    <h2 id="weeklyPnl" class="text-xl font-bold text-emerald-400">₹0.00</h2>
                </div>
                <div class="bg-gray-900 p-4 rounded-lg border border-gray-800">
                    <p class="text-xs text-gray-500 uppercase">Win Rate</p>
                    <h2 id="winRate" class="text-xl font-bold text-white">0%</h2>
                </div>
                <div class="bg-gray-900 p-4 rounded-lg border border-gray-800">
                    <p class="text-xs text-gray-500 uppercase">Total Trades</p>
                    <h2 id="totalTrades" class="text-xl font-bold text-white">0</h2>
                </div>
            </section>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- Entry Form -->
                <form id="tradeForm" class="bg-gray-900 p-6 rounded-xl border border-gray-800 space-y-4">
                    <h3 class="font-bold">Log New Trade</h3>
                    <input type="text" id="symbol" placeholder="Symbol (e.g. NIFTY)" required class="w-full bg-black border border-gray-700 p-2 rounded text-sm">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" id="entry" placeholder="Entry Price" required class="w-full bg-black border border-gray-700 p-2 rounded text-sm">
                        <input type="number" id="exit" placeholder="Exit Price" required class="w-full bg-black border border-gray-700 p-2 rounded text-sm">
                    </div>
                    <select id="type" class="w-full bg-black border border-gray-700 p-2 rounded text-sm">
                        <option value="LONG">Long</option>
                        <option value="SHORT">Short</option>
                    </select>
                    <button class="w-full bg-emerald-600 p-2 rounded text-sm font-bold">Save Trade</button>
                </form>

                <!-- History -->
                <div class="lg:col-span-2 bg-gray-900 p-6 rounded-xl border border-gray-800">
                    <table class="w-full text-left text-sm">
                        <thead><tr class="text-gray-500"><th>Symbol</th><th>P&L (₹)</th><th>Date</th></tr></thead>
                        <tbody id="tradeHistory"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Login Screen -->
    <div id="loginScreen" class="fixed inset-0 flex items-center justify-center bg-[#0d1117]">
        <div class="w-96 p-8 bg-gray-900 rounded-xl border border-gray-800">
            <h2 class="text-2xl font-bold mb-6">Login to Journal</h2>
            <input type="email" id="email" placeholder="Email" class="w-full bg-black p-2 mb-4 rounded border border-gray-700">
            <input type="password" id="pass" placeholder="Password" class="w-full bg-black p-2 mb-6 rounded border border-gray-700">
            <button onclick="handleAuth()" class="w-full bg-emerald-600 p-2 rounded font-bold">Login / Sign Up</button>
        </div>
    </div>

    <script>
        // Authentication State
        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('appContainer').classList.remove('hidden');
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('userEmail').innerText = user.email;
                loadTrades(user.uid);
            } else {
                document.getElementById('appContainer').classList.add('hidden');
                document.getElementById('loginScreen').classList.remove('hidden');
            }
        });

        async function handleAuth() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            try {
                await auth.signInWithEmailAndPassword(email, pass);
            } catch (e) {
                await auth.createUserWithEmailAndPassword(email, pass);
            }
        }

        // Firestore Logic
        document.getElementById('tradeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const uid = auth.currentUser.uid;
            const trade = {
                uid: uid,
                symbol: document.getElementById('symbol').value,
                pnl: parseFloat(document.getElementById('exit').value) - parseFloat(document.getElementById('entry').value),
                date: new Date()
            };
            await db.collection('trades').add(trade);
            e.target.reset();
        });

        function loadTrades(uid) {
            db.collection('trades').where('uid', '==', uid).onSnapshot(snapshot => {
                let trades = [];
                snapshot.forEach(doc => trades.push(doc.data()));
                render(trades);
            });
        }

        function render(trades) {
            const tbody = document.getElementById('tradeHistory');
            tbody.innerHTML = '';
            let totalPnl = 0, wins = 0;
            
            trades.sort((a,b) => b.date - a.date).forEach(t => {
                totalPnl += t.pnl;
                if(t.pnl > 0) wins++;
                tbody.innerHTML += `
                    <tr class="border-b border-gray-800">
                        <td class="py-3">${t.symbol}</td>
                        <td class="${t.pnl >= 0 ? 'text-emerald-400' : 'text-rose-400'}">₹${t.pnl.toFixed(2)}</td>
                        <td class="text-gray-500">${t.date.toDate().toLocaleDateString()}</td>
                    </tr>
                `;
            });
            
            document.getElementById('weeklyPnl').innerText = `₹${totalPnl.toFixed(2)}`;
            document.getElementById('totalTrades').innerText = trades.length;
            document.getElementById('winRate').innerText = trades.length ? ((wins/trades.length)*100).toFixed(1) + '%' : '0%';
        }
    </script>
</body>
</html>
