<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Journal</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#080c12;
    color:#fff;
}

header{
    background:#101720;
    border-bottom:1px solid #263241;
    padding:18px 20px;
}

header h1{
    font-size:22px;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:14px;
    margin-bottom:20px;
}

.card{
    background:#111923;
    border:1px solid #293544;
    border-radius:12px;
    padding:17px;
}

.card p{
    color:#8d9aaa;
    font-size:13px;
    margin-bottom:8px;
}

.card h2{
    font-size:23px;
}

.profit{
    color:#22c55e;
}

.loss{
    color:#ef4444;
}

.section{
    background:#111923;
    border:1px solid #293544;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
}

.section h2{
    margin-bottom:18px;
}

.form{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:13px;
}

input,select{
    width:100%;
    padding:12px;
    border-radius:8px;
    border:1px solid #344150;
    background:#080c12;
    color:#fff;
    outline:none;
}

input:focus,select:focus{
    border-color:#3b82f6;
}

button{
    width:100%;
    padding:12px;
    border:0;
    border-radius:8px;
    background:#2563eb;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

.calculate{
    background:#16a34a;
}

.calculate:hover{
    background:#15803d;
}

.result{
    background:#0b1119;
    border:1px solid #293544;
    border-radius:10px;
    padding:15px;
    margin-top:15px;
    display:none;
}

.result-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.result-box{
    background:#111923;
    padding:12px;
    border-radius:8px;
}

.result-box small{
    color:#8d9aaa;
    display:block;
    margin-bottom:5px;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
    min-width:950px;
}

.table-container{
    overflow-x:auto;
}

th,td{
    padding:12px 8px;
    text-align:left;
    border-bottom:1px solid #293544;
}

th{
    color:#8d9aaa;
    font-size:12px;
}

td{
    font-size:13px;
}

.delete-btn{
    background:#dc2626;
    padding:7px 10px;
    width:auto;
}

.delete-btn:hover{
    background:#b91c1c;
}

.empty{
    color:#8d9aaa;
    text-align:center;
    padding:25px;
}

@media(max-width:900px){
    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .form{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:600px){
    .container{
        padding:12px;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .form{
        grid-template-columns:1fr;
    }

    .result-grid{
        grid-template-columns:1fr 1fr;
    }
}
</style>
</head>

<body>

<header>
    <h1>📊 My Trading Journal</h1>
</header>

<div class="container">

<div class="stats">

    <div class="card">
        <p>Total Trades</p>
        <h2 id="totalTrades">0</h2>
    </div>

    <div class="card">
        <p>Win Rate</p>
        <h2 class="profit" id="winRate">0%</h2>
    </div>

    <div class="card">
        <p>Winning Trades</p>
        <h2 class="profit" id="winningTrades">0</h2>
    </div>

    <div class="card">
        <p>Losing Trades</p>
        <h2 class="loss" id="losingTrades">0</h2>
    </div>

    <div class="card">
        <p>Total P&L</p>
        <h2 id="totalPnL">₹0</h2>
    </div>

</div>


<div class="section">

<h2>➕ Add Trade</h2>

<div class="form">

<input type="date" id="date">

<input type="text" id="symbol" placeholder="Stock / Crypto">

<select id="type">
    <option value="BUY">BUY</option>
    <option value="SELL">SELL</option>
</select>

<input type="number" id="entry" placeholder="Entry Price">

<input type="number" id="exit" placeholder="Exit Price">

<input type="number" id="quantity" placeholder="Quantity">

<input type="number" id="stopLoss" placeholder="Stop Loss">

<input type="number" id="target" placeholder="Target">

<input type="text" id="strategy" placeholder="Strategy">

<button class="calculate" onclick="calculateTrade()">
    Calculate Trade
</button>

</div>


<div class="result" id="result">

<div class="result-grid">

<div class="result-box">
    <small>Profit / Loss</small>
    <strong id="calculatedPnL">₹0</strong>
</div>

<div class="result-box">
    <small>Risk / Reward</small>
    <strong id="calculatedRR">0 R</strong>
</div>

<div class="result-box">
    <small>Result</small>
    <strong id="tradeResult">-</strong>
</div>

</div>

<br>

<button onclick="saveTrade()">💾 Save Trade</button>

</div>

</div>


<div class="section">

<h2>📋 Trade History</h2>

<div id="tradeTable">
    <div class="empty">No trades added yet.</div>
</div>

</div>

</div>


<script>

let trades = JSON.parse(localStorage.getItem("trades")) || [];

function calculateTrade(){

    const entry = Number(document.getElementById("entry").value);
    const exit = Number(document.getElementById("exit").value);
    const quantity = Number(document.getElementById("quantity").value);
    const stopLoss = Number(document.getElementById("stopLoss").value);
    const target = Number(document.getElementById("target").value);
    const type = document.getElementById("type").value;

    if(!entry || !exit || !quantity){
        alert("Entry, Exit aur Quantity enter karo.");
        return;
    }

    let pnl;

    if(type === "BUY"){
        pnl = (exit - entry) * quantity;
    }else{
        pnl = (entry - exit) * quantity;
    }

    let risk = 0;
    let reward = 0;

    if(stopLoss && target){

        if(type === "BUY"){
            risk = Math.abs(entry - stopLoss);
            reward = Math.abs(target - entry);
        }else{
            risk = Math.abs(stopLoss - entry);
            reward = Math.abs(entry - target);
        }
    }

    let rr = risk > 0 ? reward / risk : 0;

    document.getElementById("calculatedPnL").innerText =
        "₹" + pnl.toFixed(2);

    document.getElementById("calculatedPnL").className =
        pnl >= 0 ? "profit" : "loss";

    document.getElementById("calculatedRR").innerText =
        rr > 0 ? rr.toFixed(2) + " R" : "N/A";

    document.getElementById("tradeResult").innerText =
        pnl > 0 ? "WIN 🟢" :
        pnl < 0 ? "LOSS 🔴" :
        "BREAK EVEN";

    document.getElementById("tradeResult").className =
        pnl > 0 ? "profit" :
        pnl < 0 ? "loss" : "";

    document.getElementById("result").style.display = "block";

}


async function saveTrade(){

    const date = document.getElementById("date").value;
    const symbol = document.getElementById("symbol").value;
    const type = document.getElementById("type").value;

    const entry = Number(document.getElementById("entry").value);
    const exit = Number(document.getElementById("exit").value);
    const quantity = Number(document.getElementById("quantity").value);
    const stopLoss = Number(document.getElementById("stopLoss").value);
    const target = Number(document.getElementById("target").value);
    const strategy = document.getElementById("strategy").value;

    if(!date || !symbol || !entry || !exit || !quantity){
        alert("Date, Symbol, Entry, Exit aur Quantity bharna zaroori hai.");
        return;
    }

    let pnl;

    if(type === "BUY"){
        pnl = (exit - entry) * quantity;
    }else{
        pnl = (entry - exit) * quantity;
    }

    let risk = 0;
    let reward = 0;

    if(stopLoss && target){

        if(type === "BUY"){
            risk = Math.abs(entry - stopLoss);
            reward = Math.abs(target - entry);
        }else{
            risk = Math.abs(stopLoss - entry);
            reward = Math.abs(entry - target);
        }
    }

    const rr = risk > 0 ? reward / risk : null;

    const {
        data: { user },
        error: userError
    } = await supabaseClient.auth.getUser();

    if(userError || !user){

        alert("Pehle Login karna hoga.");

        return;
    }

    const { error } = await supabaseClient
        .from("trades")
        .insert([{
            user_id: user.id,
            trade_date: date,
            symbol: symbol,
            trade_type: type,
            entry_price: entry,
            exit_price: exit,
            quantity: quantity,
            stop_loss: stopLoss || null,
            target: target || null,
            pnl: pnl,
            risk_reward: rr,
            strategy: strategy || null
        }]);

    if(error){

        console.error(error);

        alert("Trade save nahi hua: " + error.message);

        return;
    }

    alert("Trade cloud database mein save ho gaya! ☁️✅");

    clearForm();

    loadTrades();
}
function clearForm(){

    document.getElementById("date").value="";
    document.getElementById("symbol").value="";
    document.getElementById("entry").value="";
    document.getElementById("exit").value="";
    document.getElementById("quantity").value="";
    document.getElementById("stopLoss").value="";
    document.getElementById("target").value="";
    document.getElementById("strategy").value="";

    document.getElementById("result").style.display="none";
}


function deleteTrade(index){

    if(confirm("Is trade ko delete karna hai?")){

        trades.splice(index,1);

        localStorage.setItem("trades",JSON.stringify(trades));

        displayTrades();
    }

}


function displayTrades(){

    const table = document.getElementById("tradeTable");

    if(trades.length === 0){

        table.innerHTML =
        '<div class="empty">No trades added yet.</div>';

        updateStats();

        return;
    }

    let html = `
    <div class="table-container">
    <table>

    <tr>
        <th>Date</th>
        <th>Symbol</th>
        <th>Type</th>
        <th>Entry</th>
        <th>Exit</th>
        <th>Qty</th>
        <th>SL</th>
        <th>Target</th>
        <th>P&L</th>
        <th>R:R</th>
        <th>Strategy</th>
        <th>Action</th>
    </tr>
    `;

    trades.forEach((trade,index)=>{

        const pnlClass =
        Number(trade.pnl) >= 0 ? "profit" : "loss";

        html += `
        <tr>

        <td>${trade.date || "-"}</td>

        <td>${trade.symbol || "-"}</td>

        <td>${trade.type || "-"}</td>

        <td>₹${trade.entry || "-"}</td>

        <td>₹${trade.exit || "-"}</td>

        <td>${trade.quantity || "-"}</td>

        <td>${trade.stopLoss || "-"}</td>

        <td>${trade.target || "-"}</td>

        <td class="${pnlClass}">
        ₹${Number(trade.pnl).toFixed(2)}
        </td>

        <td>
        ${trade.rr ? Number(trade.rr).toFixed(2)+" R" : "-"}
        </td>

        <td>${trade.strategy || "-"}</td>

        <td>
        <button class="delete-btn"
        onclick="deleteTrade(${index})">
        Delete
        </button>
        </td>

        </tr>
        `;

    });

    html += `
    </table>
    </div>
    `;

    table.innerHTML = html;

    updateStats();

}


function updateStats(){

    const total = trades.length;

    const winning =
    trades.filter(t => Number(t.pnl) > 0).length;

    const losing =
    trades.filter(t => Number(t.pnl) < 0).length;

    const pnl =
    trades.reduce((sum,t)=>sum + Number(t.pnl || 0),0);

    const winRate =
    total > 0 ? (winning / total) * 100 : 0;

    document.getElementById("totalTrades").innerText = total;

    document.getElementById("winningTrades").innerText = winning;

    document.getElementById("losingTrades").innerText = losing;

    document.getElementById("winRate").innerText =
    winRate.toFixed(1) + "%";

    const pnlElement =
    document.getElementById("totalPnL");

    pnlElement.innerText =
    "₹" + pnl.toFixed(2);

    pnlElement.className =
    pnl >= 0 ? "profit" : "loss";

}


displayTrades();

</script>

</body>
</html>
